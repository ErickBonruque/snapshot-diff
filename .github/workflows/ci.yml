name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", resolution: "lowest-direct" }
          - { python: "3.12", resolution: "highest" }
          - { python: "3.13", resolution: "highest" }
    name: test (py${{ matrix.python }}, ${{ matrix.resolution }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >
          uv run --isolated --python ${{ matrix.python }}
          --resolution ${{ matrix.resolution }} --group dev
          pytest --cov=snapshot_diff --cov-report=term-missing
