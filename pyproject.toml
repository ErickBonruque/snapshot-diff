[project]
name = "snapshot-diff"
version = "0.1.0"
description = "Compare two snapshots of a table by key (inserted, updated, deleted rows and changed columns) and keep an SCD2 version history in Parquet. DuckDB, out of core."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Erick Bonruque" }]
keywords = ["duckdb", "parquet", "diff", "scd2", "data-quality", "data-engineering", "change-data-capture"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]
dependencies = ["duckdb>=1.1"]

[project.scripts]
snapshot-diff = "snapshot_diff.cli:main"

[project.urls]
Source = "https://github.com/ErickBonruque/snapshot-diff"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapshot_diff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
ignore = ["S608"]  # SQL is built from quoted identifiers and literals (see _sql.py)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
